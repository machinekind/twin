[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-mp-testbot"
version = "0.1.0"
description = "The digital twin's test robot: a robot folder and a backend plugin"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."lerobot_mp.robots"]
testbot = "testbot:ROBOT_DIR"

[project.entry-points."lerobot_mp.backends"]
testbot = "testbot.backend:create"

[tool.setuptools.packages.find]
include = ["testbot*"]

[tool.setuptools.package-data]
testbot = ["robot/*"]
