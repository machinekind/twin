[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "machinekind-twin"
version = "0.1.0"
description = "Cyfrowy blizniak stanowiska z ramieniem robota: symulacja MuJoCo, kalibracja kamer, strategie sterowania"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# `uv sync` installs the versions tested together, from uv.lock.
dependencies = [
    # contrib (a superset of opencv-python) keeps existing environments on one OpenCV package:
    # two OpenCV wheels write the same cv2/ directory and overwrite each other.
    "opencv-contrib-python>=4.8",
    "numpy>=1.24",
    "PyYAML>=6.0",
    # The plugin contracts, packages/machinekind_twin_api in this repository. They are not on PyPI;
    # `uv sync` installs them from the clone ([tool.uv.sources]).
    "machinekind-twin-api>=0.1.3,<0.2",
]

[project.optional-dependencies]
# Cyfrowy blizniak: symulacja, panel webowy, kalibracja kamer, identyfikacja dynamiki.
# pyserial: `twin check` wypisuje przejsciowki USB-serial.
twin = ["mujoco>=3.14,<3.15", "viser>=1.1", "pyserial>=3.5"]
# Skrypty z research/3d (otoczki wypukle, dobor chwytu).
research = ["trimesh>=4,<6"]

# `uv sync`: the twin with its panel, the example arm and strategy, and the dev tools. Robots come
# from their own packages, installed next to the twin.
[dependency-groups]
dev = [
    "machinekind-twin[twin]",
    "machinekind-twin-arm6",
    "machinekind-twin-cube",
    "machinekind-twin-llm",
    "machinekind-twin-swing",
    "pytest>=7.4",
    "pyright>=1.1",
    "ruff>=0.6",
]

[project.scripts]
twin = "machinekind_twin.cli:main"

# The contracts, the LLM detector and the examples come from the clone, editable.
[tool.uv.sources]
machinekind-twin-api = { path = "packages/machinekind_twin_api", editable = true }
machinekind-twin-arm6 = { path = "examples/robots/arm6", editable = true }
machinekind-twin-cube = { path = "examples/detectors/cube", editable = true }
machinekind-twin-llm = { path = "packages/machinekind_twin_llm", editable = true }
machinekind-twin-swing = { path = "examples/strategies/swing", editable = true }

# The type checker runs on the contracts and on what implements them; the rest of the twin is not typed yet.
[tool.pyright]
extraPaths = ["packages/machinekind_twin_api"]
include = [
    "packages/machinekind_twin_api",
    "packages/machinekind_twin_llm",
    "examples/detectors",
    "examples/strategies",
    "src/machinekind_twin/detection.py",
    "src/machinekind_twin/detectors.py",
    "src/machinekind_twin/episode.py",
    "src/machinekind_twin/episode_report.py",
    "src/machinekind_twin/objects.py",
    "src/machinekind_twin/plugin_settings.py",
    "src/machinekind_twin/strategy.py",
    "src/machinekind_twin/strategies.py",
    "src/machinekind_twin/tracks.py",
    "src/machinekind_twin/ui/detector_tab.py",
    "src/machinekind_twin/ui/plugin_form.py",
    "src/machinekind_twin/waypoints.py",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
machinekind_twin = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/machinekind_twin_api/tests", "packages/machinekind_twin_llm/tests"]
pythonpath = ["src"]
markers = [
    "render: test renderuje kadry przez MuJoCo/OpenGL (maszyna bez GPU: -m \"not render\")",
    "cli: test uruchamia prawdziwe CLI w podprocesie (kilka sekund; szybka petla: -m \"not cli\")",
    "llm: asks a real model through the claude or codex CLI; skipped unless MACHINEKIND_TWIN_LLM is set",
]

[tool.ruff]
line-length = 110
target-version = "py310"
