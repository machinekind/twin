[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "machinekind-twin-arm6"
version = "0.1.0"
description = "The digital twin's example arm: six joints and a parallel gripper from primitives, and an arm in memory"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["machinekind-twin-api>=0.1,<0.2"]

[project.entry-points."machinekind_twin.robots"]
arm6 = "arm6:ROBOT_DIR"

[project.entry-points."machinekind_twin.backends"]
arm6 = "arm6.backend:create"

[tool.setuptools.packages.find]
include = ["arm6*"]

[tool.setuptools.package-data]
arm6 = ["robot/*"]
