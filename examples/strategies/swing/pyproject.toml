[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "machinekind-twin-swing"
version = "0.1.0"
description = "The digital twin's test strategy from outside the twin: swings one joint, settings in a dataclass"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["machinekind-twin-api>=0.1,<0.2"]

[project.entry-points."machinekind_twin.strategies"]
swing = "swing:Swing"

[tool.setuptools.packages.find]
include = ["swing*"]
