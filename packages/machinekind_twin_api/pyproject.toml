[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "machinekind-twin-api"
version = "0.1.2"
description = "The digital twin's plugin contracts: the types a robot, backend, strategy or detector package implements"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# Only numpy: a plugin package depends on this one, never on the twin (MuJoCo, viser, torch, OpenCV).
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["machinekind_twin_api*"]

[tool.setuptools.package-data]
machinekind_twin_api = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
