[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-mp"
version = "0.1.0"
description = "Cyfrowy blizniak stanowiska z ramieniem robota: symulacja MuJoCo, kalibracja kamer, polityki RL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# Wersje sprawdzone razem sa w constraints.txt:
#   pip install -e packages/lerobot_mp_api -e ".[...]" -c constraints.txt
dependencies = [
    # contrib (a superset of opencv-python) keeps existing environments on one OpenCV package:
    # two OpenCV wheels write the same cv2/ directory and overwrite each other.
    "opencv-contrib-python>=4.8",
    "numpy>=1.24",
    "PyYAML>=6.0",
    # The plugin contracts, packages/lerobot_mp_api in this repository; not on PyPI, so it is
    # installed from the clone in the same command: pip install -e packages/lerobot_mp_api -e ".[...]"
    "lerobot-mp-api>=0.1,<0.2",
]

[project.optional-dependencies]
# Backend `lerobot` (LeRobot 0.6 wymaga Pythona 3.12).
robot = ["lerobot[feetech]>=0.6,<0.7; python_version>='3.12'"]
# Sterowanie serwami wprost, bez LeRobota i bez torcha.
feetech = ["pyserial>=3.5"]
# Most COM <-> TCP - potrzebny tylko na maszynie, do ktorej wpiete jest ramie.
bridge = ["pyserial>=3.5"]
# Cyfrowy blizniak: symulacja, srodowisko RL, panel webowy i polityki (torch - takze bez GPU).
# UWAGA: torch zainstaluj NAJPIERW z indeksu PyTorcha (cu126 albo cpu), patrz README.
twin = ["mujoco>=3.14,<3.15", "gymnasium>=1.0", "viser>=1.1", "pyserial>=3.5", "torch>=2.7,<2.12"]
# Trening na GPU: tysiace swiatow MuJoCo Warp + PPO w torchu. mujoco i mujoco-warp musza
# miec te sama wersje. Na Windows PyPI daje torch BEZ CUDA - kolo z CUDA z indeksu PyTorcha.
train = ["mujoco>=3.14,<3.15", "mujoco-warp>=3.14,<3.15", "torch>=2.7,<2.12"]
# Backend `a1x`: Galaxea A1X po CAN-FD. Protokol i lacze sa w pakiecie galaxeo (repozytorium
# galaxeo-manipulators; wymaga scalonej galezi `pkg`). macOS (dongiel XCAN): do tego pyusb + brew install libusb.
a1x = ["galaxeo @ git+https://github.com/machinekind/galaxeo-manipulators.git@main"]
# Skrypty z research/3d (otoczki wypukle, dobor chwytu).
research = ["trimesh>=4,<6"]
dev = ["pytest>=7.4", "pyright>=1.1"]

[project.scripts]
lerobot-mp-bridge = "lerobot_mp.robot.so101.serial_bridge:main"
lerobot-twin = "lerobot_mp.twin.cli:main"

# The SO-101 and A1X packages (src/lerobot_mp/robot/so101, .../a1x) register like any robot
# package (see examples/robots/testbot) until they move to the so101 repository and to galaxeo.
[project.entry-points."lerobot_mp.robots"]
so101 = "lerobot_mp.robot.so101:ROBOT_DIR"
a1x = "lerobot_mp.robot.a1x:ROBOT_DIR"

[project.entry-points."lerobot_mp.backends"]
feetech = "lerobot_mp.robot.so101.feetech:create"
lerobot = "lerobot_mp.robot.so101.lerobot_backend:create"
a1x = "lerobot_mp.robot.a1x.backend:create"

# uv (`uv run`, `uv sync`) takes the contracts from the clone, editable, like the pip line above.
[tool.uv.sources]
lerobot-mp-api = { path = "packages/lerobot_mp_api", editable = true }

# The type checker runs on the contracts and on what implements them; the rest of the twin is not typed yet.
[tool.pyright]
extraPaths = ["packages/lerobot_mp_api"]
include = [
    "packages/lerobot_mp_api",
    "examples/strategies",
    "src/lerobot_mp/twin/strategy.py",
    "src/lerobot_mp/twin/strategies.py",
    "src/lerobot_mp/twin/waypoints.py",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lerobot_mp = ["py.typed"]
"lerobot_mp.robot.so101" = ["robot/**/*"]
"lerobot_mp.robot.a1x" = ["robot/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/lerobot_mp_api/tests"]
pythonpath = ["src"]
markers = [
    "render: test renderuje kadry przez MuJoCo/OpenGL (maszyna bez GPU: -m \"not render\")",
    "cli: test uruchamia prawdziwe CLI w podprocesie (kilka sekund; szybka petla: -m \"not cli\")",
]

[tool.ruff]
line-length = 110
target-version = "py310"
