# Konfiguracja ramienia dla cyfrowego blizniaka (lerobot-twin).
#
# Sekcje `safety` i `robot` czyta blizniak (`lerobot_mp/twin/config.py`), kazda inna -
# backend albo strategia o tej nazwie. Wartosci nieobecne w pliku biora sie z wartosci domyslnych, wiec mozna
# nadpisac pojedynczy parametr bez przepisywania calosci. Nieznany klucz
# w sekcji konczy sie bledem, a nie cichym zignorowaniem.
#
# Uruchomienie:  lerobot-twin --config configs/local.yaml ui
#                - ustawia zmienna LEROBOT_MP_CONFIG. Mozna ja tez ustawic samemu.
# Wlasne wartosci trzymaj w kopii: configs/local.yaml (jest w .gitignore) -
# wystarczy w niej sekcja, ktora zmieniasz, np. tylko `robot:`.

safety:
  hold_timeout_s: 0.4       # brak dloni dluzej -> zamrozenie ruchu
  return_home_timeout_s: 6.0
  startup_ramp_s: 2.5       # plynne dojscie do pozycji domowej po starcie
  velocity_scale: 1.0       # globalny mnoznik limitow predkosci
  home_on_exit: true
  # Poza domowa i limity stawow sa w opisie ramienia (robot.yaml w folderze ramienia);
  # `safety.home` i `joints` w tym pliku nadpisuja je tylko dla ramienia o tych stawach.

robot:
  backend: sim         # sim albo wtyczka backendu z pakietu ramienia (lerobot-twin check)
  port: null           # port ramienia, np. COM5, /dev/ttyACM0; dla a1x: can0, xcan

# Kazda inna sekcja nalezy do backendu albo strategii o tej nazwie. Backend sprawdza swoja sam;
# sekcja strategii (np. `swing:`) wypelnia formularz jej ustawien w panelu (zakladka Strategie),
# a nieznany klucz albo zly typ blokuje Uruchom.

# Sekcje backendow przychodza z pakietem ramienia (SO-101: `feetech:` i `lerobot:` w pakiecie soarm).

# a1x:                 # Galaxea A1X po CAN-FD - klucze w docs/TWIN.md, rozdzial "Galaxea A1X"
