[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "machinekind-twin-testbot"
version = "0.1.0"
description = "The digital twin's test robot: a robot folder and a backend plugin"
requires-python = ">=3.10"
dependencies = ["machinekind-twin-api>=0.1,<0.2"]

[project.entry-points."machinekind_twin.robots"]
testbot = "testbot:ROBOT_DIR"

[project.entry-points."machinekind_twin.backends"]
testbot = "testbot.backend:create"

[tool.setuptools.packages.find]
include = ["testbot*"]

[tool.setuptools.package-data]
testbot = ["robot/*"]
